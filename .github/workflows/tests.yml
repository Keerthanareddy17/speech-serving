name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU-only: no torch, vllm or GPU. Tests that need them skip with a reason.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          pip install -e .
      - name: Run tests
        run: pytest -q -rs
